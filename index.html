<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta http-equiv="refresh" content="2;url=https://joystrouseauthor.proxymarketing.net">
		<title>Joy Strouse</title>
		<style>
			:root {
				color-scheme: light;
				--cream: #f8f1e5;
				--ink: #2f2a24;
				--muted: rgba(47, 42, 36, 0.72);
				--ring-1: #ff5f6d;
				--ring-2: #ffc44d;
				--ring-3: #39c6a5;
				--ring-4: #6b7cff;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
			}

			body {
				display: grid;
				place-items: center;
				font-family: Arial, Helvetica, sans-serif;
				background:
					radial-gradient(circle at top, rgba(255, 255, 255, 0.45), transparent 44%),
					linear-gradient(180deg, #fbf5ea 0%, var(--cream) 100%);
				color: var(--ink);
			}

			.splash {
				width: min(92vw, 26rem);
				padding: 2rem 1.5rem;
				text-align: center;
			}

			.loader {
				position: relative;
				width: clamp(6.5rem, 22vw, 9rem);
				aspect-ratio: 1;
				margin: 0 auto 1.4rem;
				border-radius: 50%;
				background:
					conic-gradient(from 0deg, var(--ring-1), var(--ring-2), var(--ring-3), var(--ring-4), var(--ring-1));
				animation: spin 1s linear infinite;
				box-shadow: 0 1rem 2rem rgba(47, 42, 36, 0.14), inset 0 0 0 0.5rem rgba(255, 255, 255, 0.45);
			}

			.loader::before {
				content: "";
				position: absolute;
				inset: 18%;
				border-radius: 50%;
				background:
					radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), transparent 38%),
					linear-gradient(135deg, #fff6f0, #f5ead7);
				box-shadow: inset 0 0 0 0.2rem rgba(255, 255, 255, 0.85);
			}

			.loader::after {
				content: "";
				position: absolute;
				inset: 34%;
				border-radius: 50%;
				background: linear-gradient(135deg, var(--ring-3), var(--ring-4));
				box-shadow:
					0 0 0 0.3rem rgba(255, 255, 255, 0.78),
					0 0 1.2rem rgba(107, 124, 255, 0.35);
				animation: pulse 1.2s ease-in-out infinite;
			}

			h1 {
				margin: 0 0 0.5rem;
				font-size: clamp(1.5rem, 4.8vw, 2.2rem);
				line-height: 1.1;
				letter-spacing: 0.01em;
			}

			p {
				margin: 0;
				font-size: clamp(1rem, 3.2vw, 1.08rem);
				line-height: 1.5;
				color: var(--muted);
			}

			.dots {
				display: inline-flex;
				gap: 0.3rem;
				vertical-align: middle;
				margin-left: 0.2rem;
			}

			.dots span {
				width: 0.45rem;
				height: 0.45rem;
				border-radius: 999px;
				background: currentColor;
				opacity: 0.5;
				animation: bounce 0.9s infinite ease-in-out;
			}

			.dots span:nth-child(2) {
				animation-delay: 0.12s;
			}

			.dots span:nth-child(3) {
				animation-delay: 0.24s;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			@keyframes pulse {
				0%,
				100% {
					transform: scale(0.96);
					filter: saturate(1);
				}

				50% {
					transform: scale(1.06);
					filter: saturate(1.25);
				}
			}

			@keyframes bounce {
				0%,
				80%,
				100% {
					transform: translateY(0);
					opacity: 0.45;
				}

				40% {
					transform: translateY(-0.28rem);
					opacity: 1;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.loader,
				.loader::after,
				.dots span {
					animation: none;
				}
			}
		</style>
		<script>
			setTimeout(function () {
				window.location.replace("https://joystrouse.proxymarketing.net");
			}, 2000);
		</script>
	</head>
	<body>
		<main class="splash" aria-label="Redirecting to Joy Strouse website">
			<div class="loader" aria-hidden="true"></div>
			<h1>Loading Joy Strouse</h1>
			<p>Taking you to the new site<span class="dots" aria-hidden="true"><span></span><span></span><span></span></span></p>
		</main>
	</body>
</html>
