---
layout: default
---
<article class="post" itemscope itemtype="https://schema.org/BlogPosting">

  <header class="post-hero">
    <div class="container">
      {% if page.categories %}
        <span class="post-category">{{ page.categories | first }}</span>
      {% endif %}
      <h1 class="post-title" itemprop="headline">{{ page.title }}</h1>
      <div class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
          {{ page.date | date: "%B %-d, %Y" }}
        </time>
        {% if page.author %}
          <span class="post-author" itemprop="author">by {{ page.author }}</span>
        {% endif %}
      </div>
      {% if page.image %}
        <img
          src="{{ page.image | relative_url }}"
          alt="{{ page.title }}"
          class="post-hero-image"
          width="1200"
          height="630"
          loading="eager"
        />
      {% endif %}
    </div>
  </header>

  <div class="container post-body" itemprop="articleBody">
    {{ content }}
  </div>

  <footer class="post-footer container">
    <a href="{{ '/blog/' | relative_url }}" class="btn btn-ghost">&larr; Back to Blog</a>
  </footer>

</article>
