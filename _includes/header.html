<header class="site-header" role="banner">
  <div class="header-inner">

    <!-- Logo / Site Title -->
    <a href="{{ '/' | relative_url }}" class="site-logo" aria-label="Joy Strouse — Home">
      <img
        src="{{ '/assets/images/joy-strouse-headshot-logo.jpeg' | relative_url }}"
        alt=""
        width="44"
        height="44"
        class="logo-img"
        loading="eager"
        decoding="async"
      />
      <span class="logo-text">
        <span class="logo-name">Joy Strouse</span>
        <span class="logo-tagline">Author</span>
      </span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="site-nav" aria-label="Primary navigation">
      <ul role="list">
        {% for item in site.data.navigation %}
          <li>
            <a href="{{ item.url | relative_url }}"
               {% if page.url == item.url %}aria-current="page"{% endif %}>
              {{ item.label }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>

    <!-- Mobile Hamburger -->
    <button
      class="hamburger"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
      data-hamburger
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

  </div>

</header>

<!-- Mobile Menu Panel — must live outside <header> so its z-index (150) beats
     the overlay's z-index (140) in the root stacking context. Inside a sticky
     header the panel's z-index would be scoped to the header's context (100)
     and the overlay would cover it, blocking link clicks. -->
<div class="mobile-menu" id="mobile-menu" aria-hidden="true" data-mobile-menu>
  <nav aria-label="Mobile navigation">
    <ul role="list">
      {% for item in site.data.navigation %}
        <li style="--i: {{ forloop.index }}">
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url %}aria-current="page"{% endif %}>
            {{ item.label }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</div>

<!-- Overlay for mobile menu -->
<div class="menu-overlay" data-menu-overlay aria-hidden="true"></div>
