<header class="site-header" role="banner">
  <div class="header-inner">

    <!-- Logo / Site Title -->
    <a href="{{ '/' | relative_url }}" class="site-logo" aria-label="Joy Strouse — Home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" aria-hidden="true" class="logo-svg">
        <!-- Quill pen mark -->
        <path d="M14 32 Q8 18 18 8 Q28 18 14 32Z" fill="currentColor" opacity="0.85"/>
        <path d="M14 32 L16 22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <!-- JS monogram nib hint -->
        <circle cx="14" cy="33" r="1.5" fill="currentColor" opacity="0.6"/>
      </svg>
      <span class="logo-text">
        <span class="logo-name">Joy Strouse</span>
        <span class="logo-tagline">Author</span>
      </span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="site-nav" aria-label="Primary navigation">
      <ul role="list">
        {% for item in site.data.navigation %}
          <li>
            <a href="{{ item.url | relative_url }}"
               {% if page.url == item.url %}aria-current="page"{% endif %}>
              {{ item.label }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>

    <!-- Mobile Hamburger -->
    <button
      class="hamburger"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
      data-hamburger
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

  </div>

  <!-- Mobile Menu Panel -->
  <div class="mobile-menu" id="mobile-menu" aria-hidden="true" data-mobile-menu>
    <nav aria-label="Mobile navigation">
      <ul role="list">
        {% for item in site.data.navigation %}
          <li style="--i: {{ forloop.index }}">
            <a href="{{ item.url | relative_url }}"
               {% if page.url == item.url %}aria-current="page"{% endif %}>
              {{ item.label }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>

</header>

<!-- Overlay for mobile menu -->
<div class="menu-overlay" data-menu-overlay aria-hidden="true"></div>
